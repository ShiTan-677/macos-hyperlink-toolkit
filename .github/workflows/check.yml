name: Check
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/core.test.cjs
      - run: python3 -m unittest discover -s tests -p 'test_*.py'
      - run: python3 tools/build.py
      - name: Compile standalone scripts with Apple's JavaScript engine
        run: |
          mkdir -p build/compiled
          for source in dist/*/scripts/*.js; do
            osacompile -l JavaScript -o "build/compiled/$(basename "$source" .js).scpt" "$source"
          done
      - name: Check AppKit clipboard (private pasteboard)
        run: osascript -l JavaScript tests/native-clipboard.js "$PWD/src/common.js"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-hyperlink-toolkit
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
